[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ufo-mgen"
version = "0.6.0"
description = "Topology-stratified crystal generation in the Wyckoff representation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=16.0",
    "pymatgen>=2024.8,<2027.0",
    "spglib>=2.5,<3.0",
    "pyxtal>=1.0,<2.0",
    "torch>=2.4,<3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
screening = ["smact>=2.5"]
mlip = ["chgnet>=0.4.0", "mace-torch>=0.3.10", "mattersim>=1.1.0", "phonopy>=2.21"]
mech = ["scikit-learn>=1.3"]
archives = ["zstandard>=0.22"]

[tool.setuptools.packages.find]
where = ["src"]
